<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does GDPR apply to companies outside the EU?","acceptedAnswer":{"@type":"Answer","text":"Yes, if they offer goods or services to people in the EU or monitor their behaviour. The location of the company is irrelevant — the test is the location of the data subject and the nature of the processing."}},{"@type":"Question","name":"What is the deadline for responding to a GDPR data subject request?","acceptedAnswer":{"@type":"Answer","text":"One month from receipt, extendable by two further months for complex or numerous requests provided you inform the requester within the first month and explain why. The clock starts when the request arrives, not when someone recognises it."}},{"@type":"Question","name":"Do we need a Data Protection Officer under GDPR?","acceptedAnswer":{"@type":"Answer","text":"Only if you are a public authority, if your core activities involve large-scale regular and systematic monitoring, or if they involve large-scale processing of special-category or criminal-conviction data. Most SaaS and ecommerce companies meet none of the three."}},{"@type":"Question","name":"What are the GDPR fines?","acceptedAnswer":{"@type":"Answer","text":"Up to €20 million or 4% of global annual turnover, whichever is higher, for the most serious infringements. A lower tier of €10 million or 2% applies to record-keeping and security failures."}}]}</script>
