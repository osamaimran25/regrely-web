<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/what-is-a-ropa/#article","headline":"What is a ROPA, and does your company need one?","description":"What a record of processing activities is, who GDPR Article 30 actually requires to keep one, what it must contain, and why spreadsheets fail at it.","url":"https://regrely.com/blog/what-is-a-ropa/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is a ROPA the same as a data inventory?","acceptedAnswer":{"@type":"Answer","text":"They overlap but are not identical. A data inventory catalogues what data you hold and where. A ROPA documents the processing activities — the purpose, legal basis, recipients, transfers, and retention. A good data inventory is the raw material for the ROPA, not a substitute for it."}},{"@type":"Question","name":"Do processors need a ROPA?","acceptedAnswer":{"@type":"Answer","text":"Yes, but a shorter one. Under Article 30(2) a processor records the categories of processing carried out on behalf of each controller, any third-country transfers, and a description of security measures. It does not need to record purposes or legal bases, because those belong to the controller."}},{"@type":"Question","name":"How often should a ROPA be updated?","acceptedAnswer":{"@type":"Answer","text":"Whenever processing changes — a new system, a new vendor, a new data type, a new market — not on an annual schedule. Annual reviews catch what the year forgot; they do not prevent the gap in between, which is when a DSAR or a breach will find it."}},{"@type":"Question","name":"Does a regulator actually ask to see the ROPA?","acceptedAnswer":{"@type":"Answer","text":"Yes. It is typically one of the first documents requested in an investigation, because it demonstrates whether an organisation understands its own processing. An absent or obviously stale ROPA shapes the regulator's view of everything else they then look at."}}]}</script>
