<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does running retargeting ads count as 'selling' data under CCPA?","acceptedAnswer":{"@type":"Answer","text":"Under the CPRA, disclosing identifiers to an advertising network for cross-context behavioural advertising is treated as a sale or share, even when no money changes hands. Most businesses running standard retargeting pixels are in scope and owe consumers an opt-out."}},{"@type":"Question","name":"Are we CCPA compliant if we already comply with GDPR?","acceptedAnswer":{"@type":"Answer","text":"No. GDPR is the higher structural bar, but it does not include CCPA's specific mechanics — the \"Do Not Sell or Share\" opt-out, Global Privacy Control signal handling, and the CCPA disclosure requirements. Most GDPR-compliant companies still have CCPA work to do."}},{"@type":"Question","name":"What is the deadline for a CCPA consumer request?","acceptedAnswer":{"@type":"Answer","text":"45 days from receipt, extendable by a further 45 days where reasonably necessary, provided you notify the consumer of the extension within the first 45 days."}},{"@type":"Question","name":"Does CCPA apply to a company outside the United States?","acceptedAnswer":{"@type":"Answer","text":"Yes, if it does business in California and meets one of the thresholds. There is no requirement to have a physical presence in the state."}}]}</script>
