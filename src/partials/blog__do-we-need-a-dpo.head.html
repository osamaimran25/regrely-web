<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/do-we-need-a-dpo/#article","headline":"Do we need a Data Protection Officer?","description":"When GDPR actually requires a Data Protection Officer, what the role must be able to do, and why appointing the wrong person creates a conflict of interest.","url":"https://regrely.com/blog/do-we-need-a-dpo/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can a DPO be an external contractor?","acceptedAnswer":{"@type":"Answer","text":"Yes. GDPR permits the DPO role to be fulfilled on a service contract, and outsourcing is common for smaller organisations. The same independence, expertise, and no-conflict requirements apply, and the organisation must publish the DPO's contact details and notify the supervisory authority."}},{"@type":"Question","name":"Can our CTO or Head of IT be the DPO?","acceptedAnswer":{"@type":"Answer","text":"Almost certainly not. Regulators have found that anyone who determines the purposes and means of processing has a conflict of interest, because they would be supervising their own decisions. In practice this excludes the CEO, CTO, Head of Marketing, and usually the Head of IT."}},{"@type":"Question","name":"Do we need a DPO to sell to enterprise customers?","acceptedAnswer":{"@type":"Answer","text":"Enterprise buyers frequently ask, but the honest answer — that you are not in scope under Article 37 and have a named privacy owner instead — is generally accepted. Appointing an unqualified DPO to pass a questionnaire creates a real legal obligation to satisfy a procurement checkbox."}},{"@type":"Question","name":"What happens if we appoint a DPO with a conflict of interest?","acceptedAnswer":{"@type":"Answer","text":"You have voluntarily assumed the Article 38 obligations and then breached them, in writing. Supervisory authorities have issued fines specifically for DPO conflicts of interest, and the appointment itself is the evidence."}}]}</script>
