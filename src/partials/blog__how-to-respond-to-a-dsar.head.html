<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/how-to-respond-to-a-dsar/#article","headline":"How to respond to a DSAR: a step-by-step process","description":"A practical, step-by-step process for handling a data subject access request under GDPR — deadlines, identity verification, search, redaction, and the evidence you must keep.","url":"https://regrely.com/blog/how-to-respond-to-a-dsar/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does a DSAR have to be in writing?","acceptedAnswer":{"@type":"Answer","text":"No. Under GDPR a request can be made verbally or in writing, through any channel, and it does not have to use the words 'data subject access request'. This is why intake and staff awareness matter — a valid request can arrive as a support ticket or a phone call."}},{"@type":"Question","name":"Can we charge a fee for a DSAR?","acceptedAnswer":{"@type":"Answer","text":"Generally no. The first copy must be provided free of charge. You may charge a reasonable administrative fee only for manifestly unfounded or excessive requests, particularly repetitive ones, or for additional copies — and you must be able to justify that assessment."}},{"@type":"Question","name":"Can we refuse a DSAR?","acceptedAnswer":{"@type":"Answer","text":"Only in narrow circumstances: where the request is manifestly unfounded or excessive, or where a specific exemption applies. You must still respond, explain why you are refusing, and inform the requester of their right to complain to a supervisory authority."}},{"@type":"Question","name":"What happens if we miss the DSAR deadline?","acceptedAnswer":{"@type":"Answer","text":"The requester can complain to the supervisory authority, which can investigate and take enforcement action. Missed deadlines are a common trigger for regulatory attention because they are easy for a regulator to verify and hard for an organisation to defend."}}]}</script>
