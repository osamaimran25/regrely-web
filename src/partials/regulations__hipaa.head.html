<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is a Business Associate Agreement?","acceptedAnswer":{"@type":"Answer","text":"A BAA is the contract HIPAA requires between a covered entity and any vendor handling protected health information on its behalf. Without one, the vendor cannot lawfully process PHI — which makes it a gating item in every healthcare sales cycle."}},{"@type":"Question","name":"Is our SaaS product a HIPAA business associate?","acceptedAnswer":{"@type":"Answer","text":"If it creates, receives, maintains, or transmits protected health information on behalf of a covered entity, yes — even if you never look at the data. Mere conduits for transmission, such as an ISP, are excluded, but hosted software that stores PHI is not."}},{"@type":"Question","name":"How is HIPAA different from GDPR?","acceptedAnswer":{"@type":"Answer","text":"HIPAA is US, sector-specific, and covers protected health information held by covered entities and their business associates. GDPR is EU, cross-sector, and covers all personal data, with health data treated as a special category requiring an additional condition for processing. A company operating in both markets must satisfy both."}},{"@type":"Question","name":"What is the HIPAA breach notification deadline?","acceptedAnswer":{"@type":"Answer","text":"Affected individuals and HHS must be notified without unreasonable delay and no later than 60 days from discovery. Breaches affecting 500 or more individuals also require media notification and public posting."}}]}</script>
