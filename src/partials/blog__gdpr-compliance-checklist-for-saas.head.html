<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/gdpr-compliance-checklist-for-saas/#article","headline":"A GDPR compliance checklist for SaaS companies","description":"A practical GDPR checklist for SaaS companies — controller vs processor, DPAs, subprocessors, DSARs, retention, transfers, and what enterprise security reviews actually ask for.","url":"https://regrely.com/blog/gdpr-compliance-checklist-for-saas/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is a SaaS company a controller or a processor?","acceptedAnswer":{"@type":"Answer","text":"Usually both. You are a processor for your customers' end-user data, acting on their instructions, and a controller for your own data — employees, prospects, billing contacts, and website visitors. The obligations differ, and conflating them is the most common structural error in SaaS privacy."}},{"@type":"Question","name":"Do we need a DPA with every customer?","acceptedAnswer":{"@type":"Answer","text":"Yes. GDPR Article 28 requires a data processing agreement between controller and processor. In practice every enterprise customer will send you theirs or expect you to provide one, so having your own ready to send materially shortens procurement."}},{"@type":"Question","name":"What is a subprocessor, and do we need to list them?","acceptedAnswer":{"@type":"Answer","text":"A subprocessor is any vendor that processes your customers' personal data on your behalf — your cloud provider, email service, support desk, or analytics tool. You need customer authorisation to use them, an obligation to give notice before adding new ones, and a current public list."}},{"@type":"Question","name":"What do enterprise security reviews actually ask for?","acceptedAnswer":{"@type":"Answer","text":"A current subprocessor list, your DPA, a ROPA, your DSAR process, evidence of security control testing, your breach notification process, and your international transfer mechanism. Vendors who can produce these quickly clear reviews in days rather than weeks."}}]}</script>
