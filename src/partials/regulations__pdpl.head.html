<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Is the UAE PDPL the same as GDPR?","acceptedAnswer":{"@type":"Answer","text":"It is closely modelled on GDPR — lawful bases, data subject rights, breach notification, and transfer rules all follow the same structure — but it is not identical. Consent plays a larger role as the default basis, and the thresholds, exemptions, and regulator differ."}},{"@type":"Question","name":"Does the PDPL apply to companies outside the UAE?","acceptedAnswer":{"@type":"Answer","text":"Yes, where they process the personal data of data subjects located inside the UAE. Establishment in the UAE is not required for the law to apply."}},{"@type":"Question","name":"Do the DIFC and ADGM follow the federal PDPL?","acceptedAnswer":{"@type":"Answer","text":"No. The Dubai International Financial Centre and Abu Dhabi Global Market are financial free zones with their own data protection laws, which operate separately from the federal PDPL. Companies in those zones follow the zone's regime."}},{"@type":"Question","name":"What is the lawful basis for processing under the PDPL?","acceptedAnswer":{"@type":"Answer","text":"Consent is the default, with defined exceptions including necessity for a contract, compliance with a legal obligation, protection of vital interests, and public interest. This makes consent management more central under the PDPL than under GDPR."}}]}</script>
