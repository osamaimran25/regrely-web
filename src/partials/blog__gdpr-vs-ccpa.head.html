<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/gdpr-vs-ccpa/#article","headline":"GDPR vs CCPA: the differences that actually change what you build","description":"A practical comparison of GDPR and CCPA/CPRA — scope, legal basis, consent, data subject rights, deadlines, and penalties — and what each one changes in your product.","url":"https://regrely.com/blog/gdpr-vs-ccpa/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Does GDPR apply to a US company?","acceptedAnswer":{"@type":"Answer","text":"Yes, if it offers goods or services to people in the EU or EEA, or monitors their behaviour. The location of the company is irrelevant — the test is the location of the data subject and the nature of the processing."}},{"@type":"Question","name":"Is CCPA compliance automatic if we comply with GDPR?","acceptedAnswer":{"@type":"Answer","text":"No. GDPR is the higher structural bar, but it does not include CCPA's specific mechanics — notably the 'Do Not Sell or Share My Personal Information' opt-out and its disclosure requirements. Most GDPR-compliant companies still have CCPA work to do."}},{"@type":"Question","name":"What are the penalties under each law?","acceptedAnswer":{"@type":"Answer","text":"GDPR fines reach up to €20 million or 4% of global annual turnover, whichever is higher. CCPA/CPRA penalties are assessed per violation, with a higher tier for violations involving minors, and there is a limited private right of action for certain data breaches."}},{"@type":"Question","name":"Does running retargeting ads count as selling data?","acceptedAnswer":{"@type":"Answer","text":"Under CPRA, disclosing identifiers to an advertising network for cross-context behavioural advertising is treated as a sale or share, even with no money changing hands. Most companies running standard retargeting pixels are in scope and owe consumers an opt-out."}}]}</script>
