<script type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","@id":"https://regrely.com/blog/when-is-a-dpia-required/#article","headline":"When is a DPIA required, and what goes in one?","description":"The criteria that trigger a data protection impact assessment under GDPR Article 35, what a DPIA must contain, and what to do when the residual risk stays high.","url":"https://regrely.com/blog/when-is-a-dpia-required/","datePublished":"2026-07-14","dateModified":"2026-07-14","author":{"@id":"https://regrely.com/#organization"},"publisher":{"@id":"https://regrely.com/#organization"},"image":"https://regrely.com/assets/img/og-default.jpg","inLanguage":"en","isPartOf":{"@id":"https://regrely.com/blog/#blog"}}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Who should carry out a DPIA?","acceptedAnswer":{"@type":"Answer","text":"The controller is responsible, and must seek the advice of the DPO where one is appointed. In practice it is completed by the product or system owner with privacy input — the person who knows what the system actually does — rather than written by compliance in isolation."}},{"@type":"Question","name":"Do we need a DPIA for every new feature?","acceptedAnswer":{"@type":"Answer","text":"No. Only where processing is likely to result in a high risk. The working test used by most supervisory authorities is whether the processing meets two or more of the nine criteria — profiling, automated decisions, monitoring, sensitive data, large scale, data matching, vulnerable subjects, innovative technology, or blocking a right."}},{"@type":"Question","name":"What if the DPIA shows high residual risk?","acceptedAnswer":{"@type":"Answer","text":"Article 36 requires you to consult the supervisory authority before starting the processing, and to wait for its response — up to eight weeks, extendable by six. In most cases the better answer is to redesign the processing until the residual risk is no longer high."}},{"@type":"Question","name":"Is a DPIA required for AI features?","acceptedAnswer":{"@type":"Answer","text":"Frequently, yes. AI features often meet criterion 8 (innovative use of new technology) and criterion 1 (evaluation or scoring) simultaneously — which is two of the nine, and therefore the working threshold for a mandatory DPIA."}}]}</script>
